[project]
name = "pedal-cast"
version = "0.1.0"
description = "Hourly bike-share demand forecasting per station zone, with an automated MLOps loop on GCP"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# The full runtime stack is declared up front deliberately. Resolving kfp, mlflow,
# and evidently together on day one surfaces version conflicts now instead of in
# Week 3, when they would block the pipeline work.
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "pandera>=0.20",
    "mlflow>=2.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "google-cloud-aiplatform>=1.70",
    "db-dtypes>=1.3",
    "holidays>=0.57",
    "slowapi>=0.1.9",
    "evidently>=0.4.40",
    "kfp>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pandas-stubs>=2.2",
]
# Week 5 only. Kept out of dev so routine installs stay lean.
load = ["locust>=2.31"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit — security lint, per architecture.md 10.3
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test file.
"tests/**" = ["S101"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# These ship without type stubs.
[[tool.mypy.overrides]]
module = [
    "evidently.*",
    "kfp.*",
    "mlflow.*",
    "pandera.*",
    "slowapi.*",
    "sklearn.*",
    "xgboost.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
