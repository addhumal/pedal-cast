version: 2

# Ecosystems are added as the things they scan come into existence, so Dependabot
# never points at a directory that is not there yet:
#   - npm      → web/          (Week 4b)
#   - docker   → Dockerfile    (Week 4a)

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-tool bumps; runtime deps stay individual so a
      # breaking change is easy to attribute.
      dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "pre-commit"
          - "pip-audit"
